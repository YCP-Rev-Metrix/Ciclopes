services:
  ciclopes-api:
    build: .
    image: ciclopes-api:latest
    container_name: ciclopes-api
    env_file:
      - .env

    # ── GPU access for RTX 5070 Ti (16GB) ────────────────────────────────────
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # ── Shared memory for PyTorch (dataloader multiprocessing) ───────────────
    shm_size: '8gb'

    # ── Volumes ──────────────────────────────────────────────────────────────
    volumes:
      - .:/app                                               # Live code reload
      - ./cache:/app/cache                                   # Model download cache
      - ~/.cache/huggingface:/root/.cache/huggingface        # Share HF cache with host

    # ── Environment ──────────────────────────────────────────────────────────
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - PYTHONPATH=/app:/app/core
      - HF_HOME=/root/.cache/huggingface
      - HF_TOKEN=${HF_TOKEN:-}
      - SAM3D_BODY_HF_REPO_ID=${SAM3D_BODY_HF_REPO_ID:-facebook/sam-3d-body-dinov3}
      # RTX 5070 Ti (Blackwell): PyTorch nightly ships cu130 but the base image
      # only registers cuda-12.4 libs in ldconfig. Prepend the 13.0 lib dir so
      # the dynamic linker finds libnvrtc-builtins.so.13.0 for NVRTC JIT.
      - LD_LIBRARY_PATH=/usr/local/cuda-13.0/lib64:/usr/local/nvidia/lib:/usr/local/nvidia/lib64

    # ── Ports ────────────────────────────────────────────────────────────────
    ports:
      - "8000:8000"

    stdin_open: true
    tty: true
