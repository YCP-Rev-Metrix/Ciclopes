exp:
  name: quick_debug_sl
  dataset:
    name: cifar10
    batch_size: 32
    val_ratio: 0.1
  model:
    name: resnet50_tv
    num_classes: 10
  trainer:
    name: sl
    epochs: 1
    batch_size: 64
    optimizer:
      name: sgd
      lr: 0.05
      momentum: 0.9
      weight_decay: 0.0005
      nesterov: true
    lr_scheduler:
      warmup: 10

