trainer:
  name: sl
  epochs: 200
  batch_size: 256
  label_smoothing: 0.1
  max_grad_norm: 0.0
  optimizer:
    name: sgd
    lr: 0.1
    momentum: 0.9
    weight_decay: 0.0005
    nesterov: true
  lr_scheduler:
    name: cosine
    T_max: 100000
    warmup: 500
  loader:
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4

