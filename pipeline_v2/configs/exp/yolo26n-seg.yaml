run:
  name: yolo26n-seg
  mode: train

trainer:
  type: yolo_seg

model:
  name: yolo26n-seg.pt  

data:
  name: ball_lane_pins_dataset
  path: data/data.yaml
  workers: 4

training:
  output_path: outputs/yolo26n-seg-BLP

  # Training schedule
  epochs: 200
  patience: 50

  # Image & Batch settings
  imgsz: 1024
  batch: 16

  # Data loading optimization
  workers: ${data.workers}
  cache: disk  
  device: 0

  # Performance optimization
  amp: true           
  close_mosaic: 0     

  # Optimizer
  optimizer: AdamW
  lr0: 0.001          
  lrf: 0.01           
  momentum: 0.937     
  weight_decay: 0.0005 
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1

  # Learning rate schedule
  cos_lr: true  

  # Augmentation
  hsv_h: 0.01     
  hsv_s: 0.3      
  hsv_v: 0.2      
  degrees: 0.0    
  translate: 0.05 
  scale: 0.3      
  shear: 0.0      
  perspective: 0.0 
  flipud: 0.0     
  fliplr: 0.5     
  mosaic: 0.0     
  mixup: 0.0      
  copy_paste: 0.0 

  # Segmentation-specific
  overlap_mask: true   
  mask_ratio: 4        

  # Validation & Checkpointing
  val: true
  save: true
  save_period: 20
  plots: false
  exist_ok: true

  # Deterministic training for reproducibility
  deterministic: false  

  # Additional optimizations
  rect: false  
  multi_scale: false  

wandb:
  project: ciclopes-yolo-seg
  entity: andrewolvera
  run_name: ${run.name}
  tags: [yolo26n, segmentation, bowling, indoor, lane, ball, pins, AdamW]
  notes: "Dataset pre-augmented 7x | Minimal training augs | AdamW optimizer | 1024px | batch=24"
