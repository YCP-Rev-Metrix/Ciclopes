run:
  name: yolo26n-seg
  mode: train

trainer:
  type: yolo_seg

model:
  name: yolo26n-seg.pt

data:
  name: ball_lane_pins_dataset
  path: configs/data/ball_lane_pins_dataset.yaml
  workers: 12

training:
  output_path: runs/pipeline_v2/yolo26n-seg
  epochs: 200
  batch: 16
  imgsz: 1280
  workers: ${data.workers}
  device: 0
  cache: disk

  # Optimization
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1

  # Augmentation
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0
  copy_paste: 0.1
  close_mosaic: 10

  # Segmentation-specific
  overlap_mask: true
  mask_ratio: 4

  # Runtime
  cos_lr: true
  val: true
  save: true
  plots: true
  exist_ok: true
  amp: true
  deterministic: true

wandb:
  project: yolo_seg
  entity: andrewolvera
  run_name: ${run.name}
  tags: [yolo, seg, exp1, yolo26n]
