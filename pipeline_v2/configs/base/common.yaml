run:
  name: null
  seed: 42
  mode: train

trainer:
  type: yolo_seg

model:
  name: yolo26n-seg.pt

data:
  name: ball_lane_pins_dataset
  path: configs/data/ball_lane_pins_dataset.yaml
  workers: 8

training:
  output_path: runs/pipeline_v2
  epochs: 100
  batch: 8
  imgsz: 1024
  workers: ${data.workers}
  device: 0
  cache: disk
  pretrained: true
  val: true
  save: true
  plots: true
  exist_ok: true
  amp: true
  deterministic: true

wandb:
  project: yolo_seg
  entity: andrewolvera
  run_name: ${run.name}
  tags: []
